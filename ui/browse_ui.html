<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Registry</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container register-container">
        <div class="header">
            <h1>🔍 Browse Registry</h1>
            <p>All APIs currently registered and available to AI agents</p>
            <nav class="nav-links">
                <a href="/chat-ui">🤖 Ask Agent</a>
                <a href="/registry-ui">📋 Register API</a>
                <a href="/browse-ui" class="active">🔍 Browse Registry</a>
            </nav>
        </div>

        <div style="padding: 16px 20px; border-bottom: 1px solid #eee; display:flex; gap:10px;">
            <input id="search-input" type="text" placeholder="Search by name, team, description…"
                   style="flex:1; padding:9px 14px; border:1px solid #dde1f0; border-radius:20px; font-size:14px; outline:none;">
            <span id="api-count" style="align-self:center; color:#888; font-size:13px;"></span>
        </div>

        <div id="api-list" style="padding:16px 20px; overflow-y:auto; max-height:70vh; display:flex; flex-direction:column; gap:12px;">
            <p style="color:#aaa; font-style:italic;">Loading…</p>
        </div>
    </div>
    <script>
        let allApis = [];

        async function loadApis() {
            const resp = await fetch('/registry/list');
            const data = await resp.json();
            allApis = data.apis;
            renderApis(allApis);
        }

        function renderApis(apis) {
            const list = document.getElementById('api-list');
            document.getElementById('api-count').textContent = `${apis.length} API${apis.length !== 1 ? 's' : ''}`;
            if (!apis.length) {
                list.innerHTML = '<p style="color:#aaa;font-style:italic;">No APIs found.</p>';
                return;
            }
            list.innerHTML = apis.map(a => `
                <div class="api-card">
                    <div class="api-card-header">
                        <span class="api-name">${a.name}</span>
                        <span class="api-team">${a.owner_team}</span>
                        <span class="api-method method-${a.method.toLowerCase()}">${a.method}</span>
                        <button onclick="deregisterApi('${a.api_id}', '${a.name.replace(/'/g, "\\'")}', this)" style="margin-left:auto; padding:4px 12px; font-size:12px; border-radius:12px; border:1px solid #fce4ec; background:#fff; color:#c62828; cursor:pointer;">🗑 Deregister</button>
                    </div>
                    <div class="api-desc">${a.description}</div>
                    <div class="api-meta">
                        <code>${a.endpoint}</code>
                        ${a.parameters?.length ? `<span class="api-params">params: ${a.parameters.join(', ')}</span>` : ''}
                        ${a.auth_type && a.auth_type !== 'none' ? `<span class="api-auth">🔒 ${a.auth_type}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('search-input').addEventListener('input', e => {
            const q = e.target.value.toLowerCase();
            renderApis(q ? allApis.filter(a =>
                a.name.toLowerCase().includes(q) ||
                a.description.toLowerCase().includes(q) ||
                a.owner_team.toLowerCase().includes(q)
            ) : allApis);
        });

        loadApis();

        async function deregisterApi(apiId, apiName, btn) {
            if (!confirm(`Remove "${apiName}" from the registry?`)) return;
            btn.disabled = true;
            btn.textContent = "Removing…";
            const resp = await fetch(`/registry/api/${apiId}`, { method: 'DELETE' });
            if (resp.ok) {
                allApis = allApis.filter(a => a.api_id !== apiId);
                renderApis(allApis);
            } else {
                alert("Failed to deregister API.");
                btn.disabled = false;
                btn.textContent = "🗑 Deregister";
            }
        }
    </script>
    <style>
        .api-card {
            background: white;
            border: 1px solid #e8eaf0;
            border-radius: 10px;
            padding: 14px 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .api-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .api-name  { font-weight: 700; font-size: 15px; color: #2d2d2d; }
        .api-team  { font-size: 12px; background: #f0f2ff; color: #667eea; padding: 2px 8px; border-radius: 10px; }
        .api-method { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
        .method-get    { background: #e8f5e9; color: #2e7d32; }
        .method-post   { background: #fff3e0; color: #e65100; }
        .method-put    { background: #e3f2fd; color: #1565c0; }
        .method-delete { background: #fce4ec; color: #c62828; }
        .api-desc  { font-size: 13px; color: #555; margin-bottom: 8px; }
        .api-meta  { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .api-meta code { font-size: 12px; background: #f5f5f5; padding: 2px 8px; border-radius: 4px; color: #444; }
        .api-params, .api-auth { font-size: 12px; color: #888; }
    </style>
</body>
</html>
